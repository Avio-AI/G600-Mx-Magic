<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mx Magic">
<meta name="theme-color" content="#131314">
<title>Mx Magic</title>
<style>
  :root{color-scheme:light dark}
  html,body{margin:0;height:100%;background:#f8fafd;font-family:Roboto,system-ui,-apple-system,sans-serif}
  @media (prefers-color-scheme: dark){html,body{background:#131314;color:#e3e3e3}}
  .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:15px;color:#5f6368}
  .boot .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,#f0cf93 0%,#e7bd74 45%,#c9964f 100%)}
  .boot .err{color:#b3261e;max-width:320px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="boot"><div class="logo"></div><div id="bootMsg">Loading…</div></div>
<script>
/* ═════════ Mx Magic — fleet app (main entry: avio-ai.github.io/G600-Mx-Magic/) ═════════
   One web address for several aircraft. Each aircraft keeps its own app code, settings, cases and private manual
   data repo; this page loads the selected aircraft's app into the page and adds the aircraft picker to its top bar.
   Switching aircraft reloads the page, so only one aircraft's manuals are ever in memory. */
const FLEET={
  G550:{name:'G550',full:'Gulfstream G550 (GV-SP)',src:'/G550-troubleshooter/index.html',prefix:'g550ts'},
  G650:{name:'G650',full:'Gulfstream G650 / G650ER (GVI) · training library + MEL',src:'/G600-Mx-Magic/g600.html',prefix:'g650ts',
    cfg:{name:'G650',prefix:'g650ts',type:'gvi',dataRepo:'Avio-AI/Gulfstream-MEL-Data',dataPath:'g650/',localRoot:'C:\\Gulfstream PDFs\\G650\\',sharedToken:true,snHint:'6xxx'}},
  G600:{name:'G600',full:'Gulfstream G600 (GVII-G600)',src:'/G600-Mx-Magic/g600.html',prefix:'g600ts'},
  G700:{name:'G700',full:'Gulfstream G700 (GVIII) · MEL only',src:'/G600-Mx-Magic/g600.html',prefix:'g700ts',melOnly:true,
    cfg:{name:'G700',prefix:'g700ts',dataRepo:'Avio-AI/Gulfstream-MEL-Data',dataPath:'g700/',localRoot:'C:\\Gulfstream PDFs\\G700\\',melOnly:true}},
  G800:{name:'G800',full:'Gulfstream G800 (GVIII-G800)',src:'/G600-Mx-Magic/g600.html',prefix:'g800ts',
    cfg:{name:'G800',prefix:'g800ts',type:'gviii',dataRepo:'Avio-AI/Gulfstream-MEL-Data',dataPath:'g800/',localRoot:'C:\\Gulfstream PDFs\\G800\\',sharedToken:true,snHint:'880xx',iwdmRev:'Rev 2',iwdmDefault:'88045–88059',xrefTo:'61P'}}
};
(function(){
  const q=new URLSearchParams(location.search);
  let ac=(q.get('ac')||'').toUpperCase();
  if(!FLEET[ac]){try{ac=localStorage.getItem('fleet_ac')||''}catch(e){ac=''}}
  if(!FLEET[ac])ac='G600';
  try{localStorage.setItem('fleet_ac',ac)}catch(e){}
  const A=FLEET[ac];
  document.getElementById('bootMsg').textContent='Loading '+A.name+'…';
  fetch(A.src,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(A.src+' ('+r.status+')');return r.text()}).then(html=>{
    const head=`<meta name="apple-mobile-web-app-title" content="Mx Magic"><script>window.FLEET=${JSON.stringify(FLEET)};window.FLEET_AC=${JSON.stringify(ac)};window.FLEET_CFG=${JSON.stringify(A.cfg||null)};<\/script>`;
    const tail=`<script>(${fleetUi.toString()})();<\/script>`;
    html=html.replace(/<title>[^<]*<\/title>/,`<title>Mx Magic · ${A.name}</title>`).replace('<head>','<head>'+head);
    const i=html.lastIndexOf('</body>');html=i>=0?html.slice(0,i)+tail+html.slice(i):html+tail;
    document.open();document.write(html);document.close();
  }).catch(e=>{const m=document.getElementById('bootMsg');m.className='err';m.textContent='Could not load the '+A.name+' app: '+e.message+'. Check your connection and reload.'});
})();

/* Runs inside the loaded aircraft app (uses its $, $$, esc, showModal, hideModal, store). */
function fleetUi(){
  const F=window.FLEET,AC=window.FLEET_AC;
  const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
  // tails each aircraft has seen (its last aircraft + its saved cases)
  // tails removed from the list: {TYPE:{REG:time removed}}; a tail comes back when a case for it is saved after that
  const hidden=()=>rd('fleet_hidden_tails')||{};
  const setHidden=h=>{try{localStorage.setItem('fleet_hidden_tails',JSON.stringify(h))}catch(e){}};
  const tailsFor=k=>{const P=F[k].prefix,set=new Map(),hid=hidden()[k]||{};const last=rd(P+'_lastac');
    const cases=(rd(P+'_cases')||[]).filter(c=>c&&c.form&&c.form.reg);
    const ok=r=>!hid[r]||cases.some(c=>String(c.form.reg).toUpperCase()===r&&(c.updated||0)>hid[r]);
    if(last&&last.reg){const r=String(last.reg).toUpperCase();if(ok(r))set.set(r,last.sn||'')}
    for(const c of cases){const r=String(c.form.reg).toUpperCase();if(!set.has(r)&&ok(r))set.set(r,c.form.sn||'')}return set};
  function removeTail(k,reg){const h=hidden();(h[k]=h[k]||{})[reg]=Date.now();setHidden(h);
    const P=F[k].prefix,last=rd(P+'_lastac');if(last&&String(last.reg||'').toUpperCase()===reg){try{localStorage.setItem(P+'_lastac_removed',JSON.stringify(last));localStorage.removeItem(P+'_lastac')}catch(e){}}}
  function undoRemove(k,reg){const h=hidden();if(h[k]){delete h[k][reg];setHidden(h)}
    const P=F[k].prefix,prev=rd(P+'_lastac_removed');if(prev&&String(prev.reg||'').toUpperCase()===reg&&!rd(P+'_lastac')){try{localStorage.setItem(P+'_lastac',JSON.stringify(prev))}catch(e){}}}
  const go=(k,reg,sn)=>{try{localStorage.setItem('fleet_ac',k);if(reg)localStorage.setItem(F[k].prefix+'_lastac',JSON.stringify({reg,sn:sn||''}))}catch(e){}
    const u=new URL(location.href);u.searchParams.delete('ac');location.replace(u.toString())};
  // aircraft picker in the top bar: tap the model name
  const css=document.createElement('style');css.textContent=`
    .fleetpick{display:inline-flex;align-items:center;gap:0;cursor:pointer;border-radius:10px;padding:2px 2px 2px 6px;margin-left:-6px}
    .fleetpick:hover{background:var(--hover)}
    .fleetpick .ms{font-size:22px;color:var(--text-dim);margin-left:-2px}
    .aib{margin-left:4px;padding:3px 7px}
    .fleetlist .row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-radius:12px;cursor:pointer}
    .fleetlist .row:hover{background:var(--hover)}
    .fleetlist .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#f0cf93,#e7bd74 45%,#c9964f);color:#1d1919;flex-shrink:0}
    .fleetlist .t{font-family:var(--display);font-weight:500;font-size:16px}
    .fleetlist .s{font-size:12.5px;color:var(--text-dim);margin-top:2px}
    .fleetlist .cur{margin-left:auto;color:var(--cyan)}
    .fleetlist .tails{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px 56px}
    .fleetlist .tails .tc{display:inline-flex;align-items:stretch;border:1px solid var(--border2);border-radius:8px;overflow:hidden}
    .fleetlist .tails .tc button{font-family:var(--sans);font-weight:500;font-size:13px;border:none;background:none;color:var(--text);padding:4px 10px;cursor:pointer}
    .fleetlist .tails .tc .rm{padding:0 6px;border-left:1px solid var(--border2);color:var(--text-dim);display:flex;align-items:center}
    .fleetlist .tails .tc .rm .ms{font-size:16px}
    .fleetundo{display:flex;align-items:center;gap:10px;background:var(--tonal);color:var(--on-tonal);border-radius:12px;padding:8px 10px 8px 14px;margin-top:10px;font-size:13.5px}
    .fleetundo button{margin-left:auto}
    .fleetbar{display:flex;align-items:center;gap:10px;background:var(--tonal);color:var(--on-tonal);border-radius:12px;padding:8px 10px 8px 14px;margin:8px 0 0;font-size:13.5px}
    .fleetbar button{margin-left:auto;flex-shrink:0}`;
  document.head.appendChild(css);
  // the picker arrow takes room in the top bar: shorter AI status label
  if(typeof renderAiBadge==='function'){const orig=renderAiBadge;renderAiBadge=function(){orig();const b=document.getElementById('aiBadge');if(b)b.textContent=cfg.anthropicKey?'AI':'NO KEY'};renderAiBadge()}
  const brand=document.querySelector('.brand');
  if(brand){const nameWrap=brand.querySelector('.short')&&brand.querySelector('.short').parentElement;
    if(nameWrap){const pick=document.createElement('span');pick.className='fleetpick';pick.title='Switch aircraft';
      const lg=nameWrap.querySelector('.long'),sh=nameWrap.querySelector('.short');
      if(lg)lg.textContent=F[AC].name+(F[AC].melOnly?' MEL':' Troubleshooter');if(sh)sh.textContent=F[AC].name;
      [lg,sh].forEach(x=>x&&pick.appendChild(x));pick.insertAdjacentHTML('beforeend','<span class="ms">arrow_drop_down</span>');
      nameWrap.insertBefore(pick,nameWrap.firstChild);pick.onclick=()=>openFleet()}}
  function openFleet(undo){
    const rows=Object.keys(F).map(k=>{const t=[...tailsFor(k)];
      return `<div class="row" data-ac="${k}"><span class="ico"><span class="ms">flight</span></span><div><div class="t">${esc(F[k].name)}</div><div class="s">${esc(F[k].full)}${t.length?' · '+t.length+' tail'+(t.length>1?'s':''):''}</div></div>${k===AC?'<span class="ms cur">check_circle</span>':''}</div>
        ${t.length?`<div class="tails">${t.slice(0,12).map(([r,sn])=>`<span class="tc"><button data-ac="${k}" data-reg="${esc(r)}" data-sn="${esc(sn)}">${esc(r)}</button><button class="rm" data-ac="${k}" data-rm="${esc(r)}" title="Remove ${esc(r)} from this list" aria-label="Remove ${esc(r)} from this list"><span class="ms">close</span></button></span>`).join('')}</div>`:''}`}).join('');
    showModal('Aircraft',`<div class="kv">Pick the aircraft type, or tap a tail number to open it with that registration filled in. Tap × to remove a tail from this list (its saved cases stay). Each type keeps its own manuals, settings and cases.</div><div class="fleetlist">${rows}</div>${undo?`<div class="fleetundo"><span>${esc(undo.reg)} removed from the ${esc(F[undo.k].name)} list.</span><button class="btn2 small" id="fleetUndo">Undo</button></div>`:''}`);
    const ub=document.getElementById('fleetUndo');if(ub)ub.onclick=()=>{undoRemove(undo.k,undo.reg);openFleet()};
    document.querySelectorAll('.fleetlist .tails .rm').forEach(b=>b.onclick=e=>{e.stopPropagation();removeTail(b.dataset.ac,b.dataset.rm);openFleet({k:b.dataset.ac,reg:b.dataset.rm})});
    document.querySelectorAll('.fleetlist .row').forEach(el=>el.onclick=()=>{if(el.dataset.ac===AC){hideModal();return}go(el.dataset.ac)});
    document.querySelectorAll('.fleetlist .tails button[data-reg]').forEach(b=>b.onclick=()=>{
      if(b.dataset.ac===AC){hideModal();const r=document.getElementById('fReg'),s=document.getElementById('fSn');if(r){r.value=b.dataset.reg;r.dispatchEvent(new Event('input',{bubbles:true}))}if(s&&b.dataset.sn){s.value=b.dataset.sn}return}
      go(b.dataset.ac,b.dataset.reg,b.dataset.sn)});
  }
  // typing a registration that belongs to another type offers a switch
  const reg=document.getElementById('fReg');
  if(reg){let bar=null;reg.addEventListener('input',()=>{const v=reg.value.trim().toUpperCase();if(bar){bar.remove();bar=null}if(v.length<3)return;
    for(const k of Object.keys(F)){if(k===AC)continue;const t=tailsFor(k);if(t.has(v)){bar=document.createElement('div');bar.className='fleetbar';
      bar.innerHTML=`<span class="ms">flight</span><span>${esc(v)} is a ${esc(F[k].name)}.</span><button class="btn small">Switch to ${esc(F[k].name)}</button>`;
      bar.querySelector('button').onclick=()=>go(k,v,t.get(v));reg.closest('.card').appendChild(bar);break}}})}
}
</script>
</body>
</html>
